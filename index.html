<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Senátní volby 2026 – kandidáti a výsledky</title>
    <meta name="description" content="Interaktivní mapa kandidátů do Senátu Parlamentu ČR 2026 podle obvodů. Data z otevřených dat ČSÚ, výsledky se obnovují přímo z volby.gov.cz." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4e8c'/%3E%3Cpath d='M8 21l4-10 4 6 3-4 5 8z' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="demo-banner" class="demo-banner" hidden></div>

    <header class="top">
      <div class="top-title">
        <h1>Senátní volby 2026</h1>
        <p id="subtitle" class="muted"></p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </header>

    <section id="kpis" class="kpis" aria-label="Souhrnné statistiky"></section>

    <main class="grid">
      <section class="card map-card" aria-labelledby="map-h">
        <div class="card-head">
          <h2 id="map-h">Mapa obvodů</h2>
          <div id="modes" class="seg" role="group" aria-label="Zbarvení mapy"></div>
        </div>
        <div class="map-wrap">
          <div id="map" class="map"></div>
          <div class="map-ctl" role="group" aria-label="Ovládání mapy">
            <button type="button" id="z-in" title="Přiblížit" aria-label="Přiblížit">+</button>
            <button type="button" id="z-out" title="Oddálit" aria-label="Oddálit">−</button>
            <button type="button" id="z-prague" title="Přiblížit na Prahu">Praha</button>
            <button type="button" id="z-reset" title="Celá ČR">ČR</button>
          </div>
        </div>
        <div id="legend" class="legend"></div>
      </section>

      <aside id="side" class="card side" aria-live="polite"></aside>
    </main>

    <section class="charts">
      <div class="card">
        <div class="card-head"><h2>Věk kandidátů</h2></div>
        <div id="age-chart"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h2>Kandidáti podle nominující strany</h2>
          <button type="button" id="clear-party" class="link" hidden>zrušit filtr</button>
        </div>
        <div id="party-bars" class="pbars"></div>
      </div>
    </section>

    <section class="card" id="table-card" aria-labelledby="table-h">
      <div class="card-head"><h2 id="table-h">Přehled kandidátů</h2></div>
      <div id="table"></div>
    </section>

    <footer class="foot" id="foot"></footer>

    <div id="tooltip" class="tt-wrap" role="tooltip" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
